<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Models</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      scroll-snap-type: y mandatory;
      background: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    section {
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      outline: none;
    }
    model-viewer::part(default-progress-bar) {
      background: #222;
      height: 3px;
    }
    .name {
      position: fixed;
      top: 20px;
      right: 24px;
      color: #bbb;
      font-size: 13px;
      letter-spacing: 0.04em;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <span class="name">Joshua Lieck</span>

  <section>
    <model-viewer
      src="blume1.glb"
      alt="Blume 3D Model"
      camera-controls
      touch-action="none"
      disable-zoom
      min-field-of-view="45deg"
      max-field-of-view="45deg"
      camera-orbit="30deg 75deg auto"
      shadow-intensity="0"
      exposure="1"
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="15deg"
    ></model-viewer>
  </section>

  <section>
    <model-viewer
      src="TABLE_SCAN.glb"
      alt="Table Scan 3D Model"
      camera-controls
      touch-action="none"
      disable-zoom
      min-field-of-view="45deg"
      max-field-of-view="45deg"
      camera-orbit="30deg 75deg auto"
      shadow-intensity="0"
      exposure="1"
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="15deg"
    ></model-viewer>
  </section>

  <section>
    <model-viewer
      src="model.glb"
      alt="Stromkasten 3D Model"
      camera-controls
      touch-action="none"
      disable-zoom
      min-field-of-view="45deg"
      max-field-of-view="45deg"
      camera-orbit="30deg 75deg auto"
      shadow-intensity="0"
      exposure="1"
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="15deg"
    ></model-viewer>
  </section>

</body>
</html>
