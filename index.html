<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Models</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      background: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    section {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      outline: none;
    }
    model-viewer::part(default-progress-bar) {
      background: #222;
      height: 3px;
    }
    .label {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #999;
      font-size: 13px;
      letter-spacing: 0.05em;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <section>
    <model-viewer
      src="blume1.glb"
      alt="Blume 3D Model"
      camera-controls
      touch-action="none"
      min-field-of-view="10deg"
      max-field-of-view="120deg"
      camera-orbit="30deg 75deg auto"
      shadow-intensity="0"
      exposure="1"
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="15deg"
    ></model-viewer>
    <div class="label">blume1</div>
  </section>

  <section>
    <model-viewer
      src="TABLE_SCAN.glb"
      alt="Table Scan 3D Model"
      camera-controls
      touch-action="none"
      min-field-of-view="10deg"
      max-field-of-view="120deg"
      camera-orbit="30deg 75deg auto"
      shadow-intensity="0"
      exposure="1"
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="15deg"
    ></model-viewer>
    <div class="label">table scan</div>
  </section>

  <section>
    <model-viewer
      src="model.glb"
      alt="Stromkasten 3D Model"
      camera-controls
      touch-action="none"
      min-field-of-view="10deg"
      max-field-of-view="120deg"
      camera-orbit="30deg 75deg auto"
      shadow-intensity="0"
      exposure="1"
      auto-rotate
      auto-rotate-delay="3000"
      rotation-per-second="15deg"
    ></model-viewer>
    <div class="label">stromkasten</div>
  </section>

</body>
</html>
